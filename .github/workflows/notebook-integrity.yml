name: ML notebook and dataset integrity checks
on:
  push:
  pull_request:
jobs:
  notebook-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check dataset, notebook syntax, and training statements
        run: python -m unittest discover -s tests -v
